aid: zedrun
name: Zed.run
description: >-
  Zed.run is a digital horse racing platform where players buy, breed, and race
  NFT racehorses, originally built on the Ethereum and Polygon blockchains and
  developed by Virtually Human Studio. Players collect uniquely bred digital
  racehorses as non-fungible tokens, enter them into skill- and bloodline-based
  races, and trade them on a secondary marketplace. Zed.run was surfaced as a
  portfolio company of a16z and added to the API Evangelist network for
  enrichment. As of this enrichment pass the public API host (api.zed.run)
  returns a "zed shutdown" message, indicating the developer/API surface is
  currently discontinued or paused, so no live API artifacts could be harvested.
